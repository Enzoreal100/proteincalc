<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Calc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculadora de Proteínas</h1>
    <p>Meta de Proteína Pura: 938g</p>
    <main>
        <div>
            <label for="chicken-breast">Peito de frango (g cru)</label>
            <input type="number" id="chicken-breast" min="0">
        </div>
        <div>
            <label for="chicken-gizzard">Moela de Galinha (g cru)</label>
            <input type="number" id="chicken-gizzard" min="0">
        </div>
        <div>
            <label for="liver">Fígado (g cru)</label>
            <input type="number" id="liver" min="0">
        </div>
        <div>
            <label for="pork-loin">Lombo (g cru)</label>
            <input type="number" id="pork-loin" min="0">
        </div>
        <div>
            <label for="ground-beef">Carne moída (g cru)</label>
            <input type="number" id="ground-beef" min="0">
        </div>
    </main>
    <div id="error-message"></div>
    <button id="calculate-btn">Calcular</button>
    <button id="clear-btn">Limpar Valores</button>
    <script src="script.js"></script>
</body>
</html>
